plugins {
    id 'java'
    id 'application'
    // id 'checkstyle'
}

// checkstyle {
//     toolVersion = '8.45.1'
//     configFile = file('checkstyle.xml')
// }

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
    flatDir {
        dirs 'lib'
    }
}

dependencies {
    implementation name: 'annotation'                           // @CheckForNullのタグ付用
    implementation name: 'bcpkix-jdk15on-1.68'                  // 証明書作成用
    implementation name: 'bcprov-jdk15on-1.68'                  // 証明書作成用
    implementation name: 'browsermob-dist-2.1.4'                // HTTPS通信用
    implementation name: 'commons-codec-1.15'                   // 汎用
    implementation name: 'commons-io-2.11.0'                    // 汎用
    implementation name: 'commons-lang3-3.12.0'                 // 汎用
    implementation name: 'commons-logging-1.2'                  // 汎用
    implementation name: 'javax.json-1.0'                       // JSON処理用
    implementation name: 'jintellitype-1.3.9'                   // ショートカットキー用
    implementation name: 'littleproxy-1.1.2-littleproxy-shade'  // HTTPS通信用
    implementation name: 'log4j-api-2.17.1'                     // ログ用
    implementation name: 'log4j-core-2.17.1'                    // ログ用
    implementation name: 'opencsv-2.3'                          // CSV処理用
    implementation name: 'protostuff-api-1.0.7'                 // 報告書のタグ付用
    implementation name: 'protostuff-collectionschema-1.0.7'    // 報告書のタグ付用
    implementation name: 'protostuff-core-1.0.7'                // 報告書のタグ付用
    implementation name: 'protostuff-runtime-1.0.7'             // 報告書のタグ付用
    implementation name: 'swt'                                  // 描画用
    // Arm64 : https://archive.eclipse.org/eclipse/downloads/drops4/R-4.20-202106111600/
    // x86_64: https://archive.eclipse.org/eclipse/downloads/drops4/R-4.6.2-201611241400/
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

application {
    // Define the main class for the application.
    mainClass = 'logbook.gui.ApplicationMain'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java'] // .classpath の src に相当
        }
    }
}
