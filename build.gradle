plugins {
    id 'java'
    id 'application'
    // id 'checkstyle'
}

// checkstyle {
//     toolVersion = '8.45.1'
//     configFile = file('checkstyle.xml') // ルールファイル
// }

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

application {
    // Define the main class for the application.
    mainClass = 'logbook.gui.ApplicationMain'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java'] // .classpath の src に相当
        }
    }
}

// ---------------------------
// Runnable JAR + lib 配置
// ---------------------------
def destDir = file("$buildDir/../dest")
def destLibDir = new File(destDir, "logbook_lib")

tasks.register('create_run_jar', Jar) {
    group = 'build'
    description = 'Creates a runnable JAR with libraries in subfolder.'

    archiveFileName.set('logbook.jar')
    destinationDirectory.set(destDir)

    manifest {
        attributes(
            'Main-Class': 'logbook.gui.ApplicationMain',
            'Class-Path': configurations.runtimeClasspath.files.collect { "logbook_lib/${it.name}" }.join(' ')
        )
    }

    from(sourceSets.main.output)

    doLast {
        // ライブラリコピー
        destLibDir.mkdirs()
        configurations.runtimeClasspath.each { file ->
            copy {
                from file
                into destLibDir
            }
        }
    }
}
