main.class=logbook.gui.ApplicationMain
working.directory=.
vm.location=.\runtime\bin\server\jvm.dll
classpath.1=logbook.jar
classpath.2=logbook_lib/*.jar
vmarg.1=-Djava.library.path=logbook_lib
vmarg.2=-Xms64M
vmarg.3=-Xmx4096M
# SWTがネイティブDLLを読み込むため、JDK 24以降でネイティブアクセスを許可する
vmarg.4=--enable-native-access=ALL-UNNAMED

