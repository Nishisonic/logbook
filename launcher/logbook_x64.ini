main.class=logbook.gui.ApplicationMain
working.directory=.
classpath.1=logbook.jar
classpath.2=logbook_lib/*.jar
vmarg.1=-Djava.library.path=logbook_lib
vmarg.2=-Xms16M
vmarg.3=-Xmx268M
# browsermob-distが内包する古いLittleProxy/NettyがJDK16+の強いカプセル化に
# 抵触して起動時にInaccessibleObjectExceptionを起こすため、reflectionを許可する
vmarg.4=--add-opens=java.base/java.nio=ALL-UNNAMED
vmarg.5=--add-opens=java.base/sun.nio.ch=ALL-UNNAMED
vmarg.6=--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED

